training:

  epochs: 100
  batch_size: 8
  learning_rate: 0.00006
  weight_decay: 0.01
  optimizer: adamw # Options: adam, adamw, sgd
  scheduler: cosine
  warmup_epochs: 5
  validation_split: 0.10
  shuffle: true
  random_seed: 42
  num_workers: 4
  pin_memory: true
  mixed_precision: true
  gradient_clipping: 1.0

  early_stopping:
    enabled: true
    patience: 15
    monitor: validation_loss

  loss:
    function: cross_entropy # Options: cross_entropy, dice, dice_cross_entropy, focal, tversky
    ignore_index: 255
    class_weights: null

  optimizer_parameters:
    adamw:
      betas: [0.9, 0.999]
      eps: 0.00000001
    sgd:
      momentum: 0.9
      nesterov: true

  scheduler_parameters:
    cosine:
      eta_min: 0.000001
    polynomial:
      power: 0.9
    step:
      step_size: 30
      gamma: 0.1